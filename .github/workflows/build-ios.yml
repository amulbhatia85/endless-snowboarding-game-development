name: Build iOS

# Builds the Capacitor iOS app on a GitHub-hosted Mac and launches it on an
# iOS Simulator — no local Mac required. Manual trigger only (private repos
# bill macOS minutes at 10x, so this never runs on every push).
on:
  workflow_dispatch:

jobs:
  simulator:
    name: Build & launch on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build the web game
        run: npm run build

      - name: Sync into the iOS project
        run: npx cap sync ios

      - name: Build the app for iOS Simulator (unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Boot a simulator, install and launch the app
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "Booting simulator $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.afterglow.snowboard
          sleep 18
          xcrun simctl io "$UDID" screenshot --type=png screenshot-1-menu.png
          sleep 6
          xcrun simctl io "$UDID" screenshot --type=png screenshot-2.png
          # App still alive after ~25 s? (crash would terminate the process)
          if xcrun simctl spawn "$UDID" launchctl list | grep -q com.afterglow.snowboard; then
            echo "App process alive after launch"
          else
            echo "WARNING: app process not found — possible crash"
          fi
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'processImagePath CONTAINS "App"' > app-log.txt || true

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-verification
          path: |
            screenshot-1-menu.png
            screenshot-2.png
            app-log.txt
          if-no-files-found: warn
          retention-days: 14
